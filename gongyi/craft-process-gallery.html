<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    :root {
      color-scheme: light;
      --ink: #1d2430;
      --muted: #667085;
      --line: #d9dee8;
      --soft: #f5f7fb;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-2: #b45309;
      --shadow: 0 10px 30px rgba(29, 36, 48, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f8fb;
      color: var(--ink);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(247, 248, 251, 0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .topbar {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 24px 14px;
      display: grid;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.12;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(160px, 280px) auto;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 650;
    }
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
    }
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
    }
    .pill {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 10px;
    }
    section {
      margin: 0 0 30px;
      scroll-margin-top: 138px;
    }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 12px;
      border-bottom: 2px solid #263445;
      padding-bottom: 8px;
    }
    h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: 0;
    }
    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }
    .erp-section .grid {
      grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: block;
      background: #edf1f6;
      object-fit: cover;
    }
    .erp-card img {
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #f8fafc;
    }
    .erp-card .body {
      padding: 16px 18px 18px;
    }
    .erp-card h3 {
      font-size: 19px;
    }
    .erp-card .meta {
      font-size: 13px;
    }
    .body {
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.28;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .tagrow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      color: #164e63;
      background: #e9f7fb;
      border: 1px solid #c8e8f0;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .empty {
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
    }
    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
      main, .topbar { padding-left: 14px; padding-right: 14px; }
      section { scroll-margin-top: 214px; }
      .erp-section .grid { grid-template-columns: 1fr; }
    }
    @media print {
      header { position: static; }
      .controls { display: none; }
      .card { break-inside: avoid; box-shadow: none; }
      main { max-width: none; }
    }
  </style>
</head>

    function paletteFor(text) {
      if (/金|银|镭射|电镀|金属|珐琅|拉丝|抛光|钢|铝|铁|铜/.test(text)) return ["#f8fafc", "#d7dde8", "#b7791f", "#334155"];
      if (/木|竹|清漆|上蜡|打磨|砧板/.test(text)) return ["#fff7ed", "#d97706", "#92400e", "#431407"];
      if (/皮|PU|真皮|压印|油边/.test(text)) return ["#fff7ed", "#7c2d12", "#b45309", "#451a03"];
      if (/玻璃|水晶|透明|亚克力/.test(text)) return ["#ecfeff", "#22d3ee", "#0e7490", "#155e75"];
      if (/纸|包装|标签|贴纸|画册|卡片|书|相册/.test(text)) return ["#f8fafc", "#e11d48", "#0f766e", "#1f2937"];
      if (/服装|T恤|卫衣|刺绣|缝|布|纺|家纺|帽|包|鞋/.test(text)) return ["#f0fdf4", "#0f766e", "#2563eb", "#1f2937"];
      if (/杯|陶瓷|釉|烤花/.test(text)) return ["#fffbeb", "#0891b2", "#d97706", "#1f2937"];
      if (/塑料|PVC|硅胶|注塑|吸塑/.test(text)) return ["#f5f3ff", "#7c3aed", "#db2777", "#1f2937"];
      return ["#f8fafc", "#0f766e", "#b45309", "#1f2937"];
    }

    function iconType(text) {
      if (/刺绣|绣|织唛|缝线|锁线/.test(text)) return "stitch";
      if (/热升华|转印|烫|热压|压底|高周波/.test(text)) return "heat";
      if (/丝网|水浆|胶浆|印花|胶印|柔印|凹印/.test(text)) return "screen";
      if (/激光|镭雕|内雕|雕刻|切割|CNC|打标/.test(text)) return "laser";
      if (/模切|裁切|裁剪|裁断|分切|半切|全切|Die Cut|Kiss Cut/.test(text)) return "cut";
      if (/杯|陶瓷|玻璃|水晶|釉|烤花|盘|碗/.test(text)) return "cup";
      if (/手机壳|耳机壳|MagSafe|支架|挂绳/.test(text)) return "phone";
      if (/亚克力|立牌|钥匙扣|徽章|摆件|滴胶|软胶/.test(text)) return "acrylic";
      if (/纸|包装|标签|贴纸|画册|卡片|书|相册|照片/.test(text)) return "paper";
      if (/缝制|拷边|包边|锁边|锁眼|钉扣|拉链|帽绳|整烫|熨烫/.test(text)) return "sew";
      if (/组装|安装|入盒|入袋|扫码|发货|贴码|吊牌|分拣/.test(text)) return "assembly";
      if (/水洗|洗水|酵素|石磨|砂洗|固色|蒸化|定型|柔软|阻燃|抗菌|防水/.test(text)) return "finish";

        <path d="M260 210h280M260 300h280" stroke="${a}" stroke-width="12" stroke-dasharray="16 14"/>
        <path d="M500 150l80 80-80 80-80-80z" fill="${b}" opacity=".18" stroke="${b}" stroke-width="8"/>
        <path d="M220 370l360-210" stroke="${ink}" stroke-width="10" stroke-linecap="round"/>${shine}`;
      if (type === "cup") return `
        <path d="M270 132h230v230c0 48-39 87-87 87h-56c-48 0-87-39-87-87z" fill="#fff" filter="url(#shadow)"/>
        <path d="M500 196h42c54 0 54 110 0 110h-42" fill="none" stroke="${ink}" stroke-width="20"/>
        <rect x="304" y="210" width="154" height="92" rx="18" fill="${a}" opacity=".82"/>
        <path d="M320 254c42-44 78 42 120-2" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>${shine}`;
      if (type === "phone") return `
        <rect x="286" y="92" width="228" height="360" rx="40" fill="${ink}" filter="url(#shadow)"/>
        <rect x="310" y="130" width="180" height="280" rx="24" fill="#fff"/>
        <circle cx="360" cy="170" r="26" fill="${a}"/><path d="M334 306h132" stroke="${b}" stroke-width="28" stroke-linecap="round"/>
        <path d="M348 248h104" stroke="${a}" stroke-width="18" stroke-linecap="round"/>${shine}`;
      if (type === "acrylic") return `
        <path d="M250 112h260l80 80v196H250z" fill="#fff" opacity=".78" filter="url(#shadow)" stroke="${a}" stroke-width="10"/>
        <path d="M510 112v80h80" fill="none" stroke="${a}" stroke-width="10"/>
        <circle cx="400" cy="278" r="82" fill="${a}" opacity=".18" stroke="${b}" stroke-width="14"/>
        <path d="M342 290h116" stroke="${b}" stroke-width="22" stroke-linecap="round"/>${shine}`;
      if (type === "paper") return `
        <rect x="210" y="92" width="330" height="380" rx="18" fill="#fff" filter="url(#shadow)"/>
        <path d="M260 170h230M260 222h160M260 366h230" stroke="${ink}" stroke-width="13" stroke-linecap="round" opacity=".55"/>
        <rect x="260" y="260" width="180" height="74" rx="12" fill="${a}" opacity=".78"/>
        <circle cx="496" cy="392" r="42" fill="${b}" opacity=".28"/>${shine}`;
      if (type === "sew") return `
        <path d="M192 178h294c78 0 122 42 122 112v64H192z" fill="#fff" filter="url(#shadow)"/>
        <path d="M280 180v-54h118v54" fill="none" stroke="${ink}" stroke-width="18"/>
        <path d="M470 250v130" stroke="${ink}" stroke-width="10"/><path d="M430 386h120" stroke="${a}" stroke-width="12" stroke-linecap="round"/>
        <path d="M230 308h210" stroke="${b}" stroke-width="12" stroke-dasharray="5 16" stroke-linecap="round"/>${shine}`;
      if (type === "assembly") return `
        <rect x="154" y="150" width="200" height="160" rx="24" fill="#fff" filter="url(#shadow)"/>
        <rect x="446" y="150" width="200" height="160" rx="24" fill="#fff" filter="url(#shadow)"/>
        <path d="M354 230h92" stroke="${a}" stroke-width="18" stroke-linecap="round"/><path d="M418 202l32 28-32 28" fill="none" stroke="${a}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="254" cy="230" r="48" fill="${b}" opacity=".24"/><path d="M502 230h88M546 186v88" stroke="${b}" stroke-width="16" stroke-linecap="round"/>${shine}`;
      if (type === "finish") return `
        <rect x="176" y="132" width="448" height="282" rx="34" fill="#fff" filter="url(#shadow)"/>
        <path d="M220 286c54-44 104 44 158 0s104 44 158 0" fill="none" stroke="${a}" stroke-width="18" stroke-linecap="round"/>
        <circle cx="306" cy="220" r="42" fill="${b}" opacity=".26"/><circle cx="438" cy="218" r="32" fill="${a}" opacity=".2"/>
        <path d="M250 356h300" stroke="${ink}" stroke-width="12" stroke-linecap="round" opacity=".34"/>${shine}`;
      return `
        <rect x="132" y="126" width="536" height="288" rx="30" fill="#fff" filter="url(#shadow)"/>
        <rect x="190" y="170" width="210" height="152" rx="18" fill="${a}" opacity=".82"/>
        <path d="M430 186h130M430 238h178M430 290h94" stroke="${ink}" stroke-width="16" stroke-linecap="round" opacity=".5"/>
        <path d="M212 252l54-48 92 94" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>${shine}`;
    }

    function effectSvg(text) {
      let out = "";
      if (/夜光|光变|温变|变色/.test(text)) {
        out += `<circle cx="650" cy="120" r="78" fill="#bef264" opacity=".35"/><circle cx="650" cy="120" r="42" fill="#84cc16" opacity=".44"/>`;
      }
      if (/反光|镭射|金葱|闪|金属感/.test(text)) {
        out += `<path d="M66 116h170M90 164h96M620 366h120" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity=".55"/>`;
      }
      if (/防水|水洗|洗水|喷砂/.test(text)) {
        out += `<path d="M112 92c24 46 72 46 96 0 24 46 72 46 96 0" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity=".45"/>`;
      }
      return out;
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const selected = categorySelect.value;
      gallery.innerHTML = "";
      let visibleCount = 0;
      let sectionCount = 0;

      normalized.forEach((group, index) => {
        if (selected !== "" && Number(selected) !== index) return;
        const items = group.items.filter(item => {
          const haystack = `${group.category} ${item.name} ${item.applies} ${item.feature}`.toLowerCase();
          return !q || haystack.includes(q);
        });
        if (!items.length) return;
        visibleCount += items.length;
        sectionCount += 1;

        const section = document.createElement("section");
        const id = `cat-${index}`;
        section.id = id;
        const isErpSection = group.category.startsWith("二十一、ERP 工艺字典");
        if (isErpSection) section.className = "erp-section";
        section.innerHTML = `
          <div class="section-head">
            <h2>${escapeHtml(group.category)}</h2>
            <span class="count">${items.length} 项</span>
          </div>
          <div class="grid"></div>
        `;
        const grid = section.querySelector(".grid");
        items.forEach(item => {
          const card = document.createElement("article");
          card.className = isErpSection ? "card erp-card" : "card";
          const scopedKey = `${group.category}::${item.name}`;
          const isTextileCategory = group.category.startsWith("一、服装纺织类工艺");
          const isHardgoodsCategory = /^二、|^三、|^四、|^五、/.test(group.category);
          const isMaterialCategory = /^六、|^七、|^八、|^九、/.test(group.category);
          const isSoftgoodsPlasticCategory = /^十、|^十一、|^十二、|^十三、|^十四、/.test(group.category);
          const isGiftPhotoKitchenCategory = /^十五、|^十六、|^十七、/.test(group.category);
          const isOutdoorAdEffectsCategory = /^十八、|^十九、|^二十、/.test(group.category);
          const isErpCategory = group.category.startsWith("二十一、ERP 工艺字典");
          const img = isTextileCategory
            ? textilePhotoAssets[item.name] || processSvg(item, group.category)
            : isHardgoodsCategory
              ? scopedHardgoodsPhotoAssets[scopedKey] || hardgoodsPhotoAssets[item.name] || processSvg(item, group.category)
              : isMaterialCategory
                ? materialPhotoAssets[scopedKey] || processSvg(item, group.category)
                : isSoftgoodsPlasticCategory
                  ? softgoodsPlasticPhotoAssets[scopedKey] || processSvg(item, group.category)
                  : isGiftPhotoKitchenCategory
                    ? giftPhotoKitchenPhotoAssets[scopedKey] || processSvg(item, group.category)
                    : isOutdoorAdEffectsCategory
                      ? outdoorAdEffectsPhotoAssets[scopedKey] || processSvg(item, group.category)
                      : isErpCategory
                        ? erpDiagramAssets[scopedKey] || processSvg(item, group.category)
                        : processSvg(item, group.category);
          const imgSrc = img.startsWith("assets/") ? `${img}?v=${imageAssetVersion}` : img;
          const meta = [item.applies && `适用：${item.applies}`, item.feature && `特点：${item.feature}`].filter(Boolean).join("<br>");
          card.innerHTML = `
            <img src="${imgSrc}" alt="${escapeHtml(item.name)} 工艺示意图" loading="lazy">
            <div class="body">
              <h3>${escapeHtml(item.name)}</h3>
              <div class="meta">${meta || "工艺节点 / ERP字典项"}</div>
              <div class="tagrow">
                ${tagsFor(item, group.category).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
        gallery.appendChild(section);
      });

      stats.innerHTML = `
        <span class="pill">总工艺图卡：${allCount}</span>
        <span class="pill">当前显示：${visibleCount}</span>
        <span class="pill">分类：${sectionCount}</span>
        <span class="pill">图片模式：一至二十类 AI 实拍图，ERP 字典为内嵌 SVG 示意图</span>
      `;
      if (!visibleCount) gallery.innerHTML = `<div class="empty">没有匹配结果。换一个关键词试试。</div>`;
    }

    function tagsFor(item, category) {
      const text = `${item.name} ${item.applies} ${item.feature} ${category}`;
      const tags = [];
      const pairs = [
        [/UV|数码|喷墨|直喷|打印|写真/, "打印"],
        [/热升华|转印|烫画|烫压/, "热转印"],
        [/丝网|丝印|胶印|柔印|凹印|移印/, "印刷"],
        [/刺绣|绣|缝|锁边|包边/, "纺织"],
        [/激光|镭雕|雕刻|切割|CNC/, "雕刻切割"],
        [/覆膜|光油|滴胶|抛光|喷砂|电镀|烤漆|珐琅/, "后处理"],
        [/组装|安装|入袋|发货|贴标|吊牌/, "组装包装"],
        [/金|银|反光|夜光|变色|透明|磨砂|立体|防水|防刮/, "特殊效果"]
      ];
      pairs.forEach(([re, tag]) => { if (re.test(text)) tags.push(tag); });
      return tags.slice(0, 3);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function safeSvgText(value) {
      const str = String(value || "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[char]));
      return str.length > 28 ? str.slice(0, 27) + "…" : str;
    }

    search.addEventListener("input", render);
    categorySelect.addEventListener("change", render);
    reset.addEventListener("click", () => {
      search.value = "";
      categorySelect.value = "";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    render();
  </script>
</body>
</html>
