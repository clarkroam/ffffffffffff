  <g transform="translate(1100 258)">
    <rect x="0" y="0" width="370" height="560" rx="24" fill="#f8fafc" stroke="#d9dee8"/>
    <text x="30" y="54" font-size="32" font-weight="850" fill="#111827" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">特性与用途</text>
    <text x="34" y="124" font-size="25" font-weight="650" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 影响可承印材料与图案精度</text>
<text x="34" y="166" font-size="25" font-weight="650" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 决定是否需要白墨、光油、分色或制版</text>
<text x="34" y="208" font-size="25" font-weight="650" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 适合作为订单工艺主标签与产线入口</text>
    <rect x="34" y="430" width="302" height="78" rx="22" fill="#0f766e" opacity="0.92"/>
    <text x="66" y="480" font-size="28" font-weight="850" fill="#fff" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">ERP 六层工艺字典</text>
  </g>
