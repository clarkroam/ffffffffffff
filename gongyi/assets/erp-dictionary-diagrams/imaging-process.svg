<text x="34" y="196" font-size="28" font-weight="650" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">回答“用什么方式成像”</text>
<text x="34" y="242" font-size="28" font-weight="650" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">连接设备、墨水、版材与工艺路线</text>
