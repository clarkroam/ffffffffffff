<rect x="250" y="184" width="96" height="40" rx="20" fill="#64748b" opacity="0.14" stroke="#64748b" stroke-width="1.5"/>
<text x="267" y="211" font-size="22" font-weight="700" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">称重</text>
<rect x="360" y="184" width="96" height="40" rx="20" fill="#64748b" opacity="0.14" stroke="#64748b" stroke-width="1.5"/>
<text x="377" y="211" font-size="22" font-weight="700" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">扫码</text>
<rect x="30" y="242" width="96" height="40" rx="20" fill="#64748b" opacity="0.14" stroke="#64748b" stroke-width="1.5"/>
