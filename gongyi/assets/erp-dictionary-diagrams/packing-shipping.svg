  <circle cx="1370" cy="155" r="155" fill="#64748b" opacity="0.14"/>
  <circle cx="124" cy="820" r="120" fill="#64748b" opacity="0.1"/>
  <rect x="70" y="62" width="1460" height="836" rx="34" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="62" width="1460" height="150" rx="34" fill="#334155"/>
  <path d="M70 178h1460v34H70z" fill="#334155"/>
  <text x="112" y="132" font-size="56" font-weight="900" fill="#ffffff" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">包装发货工艺</text>
  <text x="112" y="178" font-size="25" font-weight="500" fill="#e8fffb" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">把成品转成可交付包裹，连接电商履约、追踪和一件代发</text>
