<rect x="140" y="242" width="96" height="40" rx="20" fill="#64748b" opacity="0.14" stroke="#64748b" stroke-width="1.5"/>
<text x="157" y="269" font-size="22" font-weight="700" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">分拣</text>
<rect x="250" y="242" width="96" height="40" rx="20" fill="#64748b" opacity="0.14" stroke="#64748b" stroke-width="1.5"/>
<text x="267" y="269" font-size="22" font-weight="700" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">分包</text>
<rect x="360" y="242" width="96" height="40" rx="20" fill="#64748b" opacity="0.14" stroke="#64748b" stroke-width="1.5"/>
<text x="377" y="269" font-size="22" font-weight="700" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">发货</text>
  </g>
  <g transform="translate(1100 258)">
    <rect x="0" y="0" width="370" height="560" rx="24" fill="#f8fafc" stroke="#d9dee8"/>
    <text x="30" y="54" font-size="32" font-weight="850" fill="#111827" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">特性与用途</text>
    <text x="34" y="124" font-size="25" font-weight="650" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 影响包裹完整性、错发率和物流追踪</text>
<text x="34" y="166" font-size="25" font-weight="650" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 适合绑定订单号、条码、批次和称重数据</text>
<text x="34" y="208" font-size="25" font-weight="650" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 是 POD 一件代发闭环的最后一层</text>
    <rect x="34" y="430" width="302" height="78" rx="22" fill="#334155" opacity="0.92"/>
    <text x="66" y="480" font-size="28" font-weight="850" fill="#fff" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">ERP 六层工艺字典</text>
  </g>
