<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>套图/拉图问题分析仪表盘</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f4f6fa;
  color: #1f2937;
  line-height: 1.5;
}
.header {
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  color: #fff;
  padding: 24px 32px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.header .sub { font-size: 13px; opacity: .85; }

.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  padding: 24px 32px 0;
}
.kpi {
  background: #fff;
  padding: 18px 20px;
  border-radius: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  border-left: 4px solid #4f46e5;
}
.kpi .label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
.kpi .value { font-size: 26px; font-weight: 700; color: #1f2937; }
.kpi .value .sm { font-size: 14px; color: #9ca3af; font-weight: 500; }
.kpi.high { border-left-color: #ef4444; }
.kpi.mid { border-left-color: #f59e0b; }
.kpi.low { border-left-color: #10b981; }

.charts-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 16px;
  padding: 24px 32px 0;
}
@media (max-width: 1100px) {
  .charts-row { grid-template-columns: 1fr; }
}
.chart-card {
  background: #fff;
  padding: 16px 20px;
  border-radius: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.chart-card h3 {
  font-size: 14px;
  margin-bottom: 12px;
  color: #374151;
  font-weight: 600;
}
.chart-card canvas { max-height: 260px; }

.main {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 16px;
  padding: 24px 32px 40px;
}
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
}
.sidebar {
  background: #fff;
  padding: 18px 20px;
  border-radius: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  height: fit-content;
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
}
.sidebar h4 {
  font-size: 13px;
  color: #4b5563;
  margin: 14px 0 8px;
  font-weight: 600;
  padding-bottom: 4px;
  border-bottom: 1px solid #f3f4f6;
}
.sidebar h4:first-child { margin-top: 0; }
.filter-item {
  display: flex;
  align-items: center;
  font-size: 13px;
  padding: 4px 0;
  cursor: pointer;
  color: #374151;
  transition: color .15s;
}
.filter-item:hover { color: #4f46e5; }
.filter-item input { margin-right: 8px; cursor: pointer; }
.filter-item .count {
  margin-left: auto;
  color: #9ca3af;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.search-box {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 14px;
}
.search-box:focus {
  outline: none;
  border-color: #4f46e5;
  box-shadow: 0 0 0 2px rgba(79,70,229,.15);
}
.btn-clear {
  width: 100%;
  margin-top: 12px;
  padding: 8px;
  background: #f3f4f6;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  color: #4b5563;
}
.btn-clear:hover { background: #e5e7eb; }

.content {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  overflow: hidden;
}
.content-header {
  padding: 16px 20px;
  border-bottom: 1px solid #f3f4f6;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.content-header .count-info {
  font-size: 13px;
  color: #6b7280;
}
.content-header .count-info b { color: #4f46e5; }
.sort-select {
  padding: 6px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 12px;
  background: #fff;
}

.issue-list { max-height: 1200px; overflow-y: auto; }
.issue-item {
  padding: 14px 20px;
  border-bottom: 1px solid #f3f4f6;
  cursor: pointer;
  transition: background .15s;
}
.issue-item:hover { background: #fafbfd; }
.issue-row1 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.sev-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
}
.sev-高 { background: #fee2e2; color: #b91c1c; }
.sev-中 { background: #fef3c7; color: #b45309; }
.sev-低 { background: #d1fae5; color: #047857; }
.tag-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: #ede9fe;
  color: #5b21b6;
}
.theme-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: #e0e7ff;
  color: #3730a3;
}
.id-badge {
  font-family: ui-monospace, "SF Mono", monospace;
  font-size: 11px;
  color: #9ca3af;
}
.issue-meta {
  font-size: 11px;
  color: #9ca3af;
  margin-left: auto;
}
.issue-text {
  font-size: 13px;
  color: #374151;
  margin: 4px 0;
  line-height: 1.55;
}
.issue-detail {
  display: none;
  background: #f9fafb;
  padding: 12px 14px;
  border-radius: 6px;
  margin-top: 10px;
  font-size: 12px;
  color: #4b5563;
  white-space: pre-wrap;
  border-left: 3px solid #c7d2fe;
}
.issue-item.expanded .issue-detail { display: block; }

.pagination {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-top: 1px solid #f3f4f6;
}
.pagination button {
  padding: 5px 10px;
  border: 1px solid #d1d5db;
  background: #fff;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
}
.pagination button:disabled { opacity: .4; cursor: not-allowed; }
.pagination button.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
.pagination .info { font-size: 12px; color: #6b7280; }

.cause-section {
  padding: 24px 32px;
}
.cause-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.cause-card {
  background: #fff;
  padding: 16px 20px;
  border-radius: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  border-top: 3px solid #4f46e5;
}
.cause-card h5 {
  font-size: 14px;
  color: #1f2937;
  margin-bottom: 8px;
  font-weight: 600;
}
.cause-card p {
  font-size: 12.5px;
  color: #4b5563;
  line-height: 1.6;
  margin-bottom: 6px;
}
.cause-card .freq { font-size: 11px; color: #9ca3af; }
.section-title {
  font-size: 16px;
  font-weight: 700;
  color: #1f2937;
  margin: 0 0 14px;
  padding: 0 32px;
}
</style>
</head>
<body>
<div class="header">
  <h1>📊 套图 / 拉图 问题分析仪表盘</h1>

</div>

<div class="kpi-row">

  <div class="kpi mid">

  </div>
  <div class="kpi low">
    <div class="label">低严重度 / 咨询</div>
    <div class="value" id="kpiLow">- <span class="sm" id="kpiLowPct"></span></div>
  </div>
  <div class="kpi" style="border-left-color:#06b6d4">
    <div class="label">套图相关</div>
    <div class="value" id="kpiSet">-</div>
  </div>
  <div class="kpi" style="border-left-color:#ec4899">

    <div class="value" id="kpiPull">-</div>

</div>

<div class="charts-row">

  </div>
</div>

<h3 class="section-title" style="margin-top:32px">🔍 原因分析</h3>
<div class="cause-section" style="padding-top:0">
  <div class="cause-grid" id="causeGrid"></div>
</div>

<h3 class="section-title">📋 问题列表</h3>
<div class="main">

    <h4>主题</h4>
    <div id="filterTheme"></div>
    
    <h4>严重程度</h4>
    <div id="filterSev"></div>
    
    <h4>问题分类</h4>
    <div id="filterTag"></div>
    
    <h4>用户角色</h4>
    <div id="filterRole"></div>

  </aside>
  
  <section class="content">

    <div class="issue-list" id="issueList"></div>
    <div class="pagination" id="pagination"></div>
  </section>
</div>

<script>
// === 状态 ===
const state = {
  filters: { theme: new Set(), sev: new Set(), tag: new Set(), role: new Set() },
  search: '',
  sort: 'severity',
  page: 1,
  pageSize: 30,
};

// === 工具 ===
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString();
const sevOrder = { '高': 0, '中': 1, '低': 2 };

// === 计算筛选结果 ===
function getFiltered() {
  const s = state.search.trim().toLowerCase();
  return ISSUES.filter(it => {
    if (state.filters.theme.size && !state.filters.theme.has(it.theme)) return false;
    if (state.filters.sev.size && !state.filters.sev.has(it.severity)) return false;
    if (state.filters.tag.size && !it.tags.some(t => state.filters.tag.has(t))) return false;
    if (state.filters.role.size && !it.roles.some(r => state.filters.role.has(r))) return false;
    if (s) {
      const blob = (it.core + ' ' + it.all_q + ' ' + it.id + ' ' + it.tags.join(' ')).toLowerCase();
      if (!blob.includes(s)) return false;
    }
    return true;
  });
}

function sortItems(items) {
  const arr = [...items];
  if (state.sort === 'severity') {
    arr.sort((a,b) => sevOrder[a.severity] - sevOrder[b.severity] || (b.date || '').localeCompare(a.date || ''));
  } else if (state.sort === 'date_desc') {
    arr.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  } else if (state.sort === 'date_asc') {
    arr.sort((a,b) => (a.date || '').localeCompare(b.date || ''));
  }
  return arr;
}

// === KPI ===
function renderKPI() {
  const f = getFiltered();
  $('kpiTotal').textContent = fmt(f.length);
  const sevCnt = { '高':0, '中':0, '低':0 };
  let setN=0, pullN=0;
  f.forEach(it => {
    sevCnt[it.severity]++;
    if (it.theme === '套图' || it.theme === '套图&拉图') setN++;
    if (it.theme === '拉图' || it.theme === '套图&拉图') pullN++;
  });
  const tot = f.length || 1;
  $('kpiHigh').innerHTML = fmt(sevCnt['高']) + ` <span class="sm">${(sevCnt['高']/tot*100).toFixed(1)}%</span>`;
  $('kpiMid').innerHTML = fmt(sevCnt['中']) + ` <span class="sm">${(sevCnt['中']/tot*100).toFixed(1)}%</span>`;
  $('kpiLow').innerHTML = fmt(sevCnt['低']) + ` <span class="sm">${(sevCnt['低']/tot*100).toFixed(1)}%</span>`;
  $('kpiSet').textContent = fmt(setN);
  $('kpiPull').textContent = fmt(pullN);
}

// === 列表 ===
function renderList() {
  const filtered = sortItems(getFiltered());
  $('cntShown').textContent = fmt(Math.min(filtered.length, state.page * state.pageSize));
  $('cntTotal').textContent = fmt(filtered.length);
  
  const start = (state.page - 1) * state.pageSize;
  const pageItems = filtered.slice(start, start + state.pageSize);
  
  const html = pageItems.map(it => {
    const tagsHtml = it.tags.map(t => `<span class="tag-badge">${t}</span>`).join('');
    return `
      <div class="issue-item" data-id="${it.id}">
        <div class="issue-row1">
          <span class="sev-badge sev-${it.severity}">${it.severity}</span>
          <span class="theme-badge">${it.theme}</span>
          ${tagsHtml}
          <span class="issue-meta">${it.date} · 客服:${it.staff}</span>
        </div>
        <div class="issue-text">${escapeHtml(it.core)}</div>
        <div class="id-badge">会话ID: ${it.id} · 访客: ${escapeHtml(it.visitor || '-')} · 共 ${it.q_count} 条提问</div>
        <div class="issue-detail">${escapeHtml(it.all_q)}</div>
      </div>`;
  }).join('');
  $('issueList').innerHTML = html || '<div style="padding:60px;text-align:center;color:#9ca3af">没有找到匹配的问题</div>';
  
  // 绑定展开事件
  document.querySelectorAll('.issue-item').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('expanded'));
  });
  
  renderPagination(filtered.length);
}

function renderPagination(total) {
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  let html = `<button onclick="goPage(${state.page-1})" ${state.page===1?'disabled':''}>← 上页</button>`;
  // 显示部分页码
  const showPages = [];
  if (totalPages <= 7) {
    for (let i=1; i<=totalPages; i++) showPages.push(i);
  } else {
    showPages.push(1);
    if (state.page > 3) showPages.push('...');
    for (let i=Math.max(2, state.page-1); i<=Math.min(totalPages-1, state.page+1); i++) showPages.push(i);
    if (state.page < totalPages-2) showPages.push('...');
    showPages.push(totalPages);
  }
  showPages.forEach(p => {
    if (p === '...') html += `<span class="info">...</span>`;
    else html += `<button class="${p===state.page?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });
  html += `<button onclick="goPage(${state.page+1})" ${state.page>=totalPages?'disabled':''}>下页 →</button>`;
  html += `<span class="info">共 ${totalPages} 页</span>`;
  $('pagination').innerHTML = html;
}
window.goPage = (p) => { state.page = p; renderList(); window.scrollTo({top:document.querySelector('.section-title:last-of-type').offsetTop, behavior:'smooth'}); };

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// === 筛选器 UI ===
function buildFilters() {
  // 主题
  const themes = ['套图', '拉图', '套图&拉图'];
  $('filterTheme').innerHTML = themes.map(t => {
    const c = ISSUES.filter(i => i.theme === t).length;
    return `<label class="filter-item"><input type="checkbox" data-cat="theme" value="${t}"><span>${t}</span><span class="count">${c}</span></label>`;
  }).join('');
  
  // 严重度
  const sevs = ['高', '中', '低'];
  $('filterSev').innerHTML = sevs.map(s => {
    const c = ISSUES.filter(i => i.severity === s).length;
    return `<label class="filter-item"><input type="checkbox" data-cat="sev" value="${s}"><span>${s}</span><span class="count">${c}</span></label>`;
  }).join('');
  
  // 标签
  const tagSorted = Object.entries(AGGS.tags).sort((a,b)=>b[1]-a[1]);
  $('filterTag').innerHTML = tagSorted.map(([t,c]) => 
    `<label class="filter-item"><input type="checkbox" data-cat="tag" value="${t}"><span>${t}</span><span class="count">${c}</span></label>`
  ).join('');
  
  // 角色
  const roleSorted = Object.entries(AGGS.roles).sort((a,b)=>b[1]-a[1]);
  $('filterRole').innerHTML = roleSorted.map(([r,c]) => 
    `<label class="filter-item"><input type="checkbox" data-cat="role" value="${r}"><span>${r}</span><span class="count">${c}</span></label>`
  ).join('');
  
  // 绑定
  document.querySelectorAll('.sidebar input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const cat = cb.dataset.cat;
      const val = cb.value;
      if (cb.checked) state.filters[cat].add(val);
      else state.filters[cat].delete(val);
      state.page = 1;
      refresh();
    });
  });
}

window.clearFilters = () => {
  Object.keys(state.filters).forEach(k => state.filters[k].clear());
  document.querySelectorAll('.sidebar input[type=checkbox]').forEach(cb => cb.checked = false);
  $('searchInput').value = '';
  state.search = '';
  state.page = 1;
  refresh();
};

// === 图表 ===
let chartTags, chartSev, chartDate;
function initCharts() {
  chartTags = new Chart($('chartTags'), {
    type: 'bar',
    data: { labels: [], datasets: [{ data: [], backgroundColor: '#6366f1', borderRadius: 4 }] },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false } }, y: { ticks: { font: { size: 11 } } } }
    }
  });
  chartSev = new Chart($('chartSev'), {
    type: 'doughnut',
    data: { labels: [], datasets: [{ data: [], backgroundColor: ['#ef4444','#f59e0b','#10b981'], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } }
  });
  chartDate = new Chart($('chartDate'), {
    type: 'line',
    data: { labels: [], datasets: [{ data: [], borderColor: '#7c3aed', backgroundColor: 'rgba(124,58,237,.12)', fill: true, tension: 0.35, pointRadius: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: { size: 9 }, maxRotation: 45, minRotation: 45 } }, y: { beginAtZero: true } }
    }
  });
}

function updateCharts() {
  const f = getFiltered();
  // tags
  const tagCnt = {};
  f.forEach(it => it.tags.forEach(t => tagCnt[t] = (tagCnt[t]||0)+1));
  const sorted = Object.entries(tagCnt).sort((a,b)=>b[1]-a[1]).slice(0,12);
  chartTags.data.labels = sorted.map(x=>x[0]);
  chartTags.data.datasets[0].data = sorted.map(x=>x[1]);
  chartTags.update();
  
  // severity
  const sevCnt = {'高':0,'中':0,'低':0};
  f.forEach(it => sevCnt[it.severity]++);
  chartSev.data.labels = Object.keys(sevCnt).map(k=>`${k} (${sevCnt[k]})`);
  chartSev.data.datasets[0].data = Object.values(sevCnt);
  chartSev.update();
  
  // dates
  const dCnt = {};
  f.forEach(it => { if (it.date) dCnt[it.date] = (dCnt[it.date]||0)+1; });
  const dates = Object.keys(dCnt).sort();
  chartDate.data.labels = dates;
  chartDate.data.datasets[0].data = dates.map(d => dCnt[d]);
  chartDate.update();
}

  { tag: '文件夹/路径/命名问题', title: '文件夹/文件名规则脆弱', cause: '"文件名变小写" "今天与昨天文件名不同无法替换" "拉图按文件名出图但替换失败"。系统对文件名大小写、版本变更敏感。' },
  { tag: '套图成功但拉图失败', title: '【关键缺陷】套图成功状态被误标', cause: '客户反复反馈: 显示成功实际缺图,需要重新套图碰运气。建议: 拉图前增加一致性校验,缺图不应进"套图成功"状态。' },
  { tag: '多设备/服务器问题', title: '多电脑/服务器协作问题', cause: '"一人点立即套图三台同步跑" "服务器文件夹上锁影响调取" "国内一台电脑套图跨境拉图"。多终端共享套图资源时存在并发与权限边界问题。' },
];

function renderCauses() {
  const html = CAUSES.map(c => {
    const cnt = AGGS.tags[c.tag] || 0;
    return `<div class="cause-card">
      <h5>${c.title}</h5>
      <p>${c.cause}</p>
      <div class="freq">📌 关联标签: <b>${c.tag}</b> · 命中 ${cnt} 条会话</div>
    </div>`;
  }).join('');
  $('causeGrid').innerHTML = html;
}

// === 主流程 ===
function refresh() {
  renderKPI();
  updateCharts();
  renderList();
}

document.addEventListener('DOMContentLoaded', () => {
  buildFilters();
  initCharts();
  renderCauses();
  $('searchInput').addEventListener('input', e => {
    state.search = e.target.value;
    state.page = 1;
    refresh();
  });
  $('sortSelect').addEventListener('change', e => {
    state.sort = e.target.value;
    refresh();
  });
  refresh();
});
</script>
</body>
</html>
