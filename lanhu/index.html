<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const TID = DATA.tid, PID = DATA.pid;
  const docs = DATA.docs, pages = DATA.pages;
  const PAGE_SIZE = 80;
  const MAX_RESULTS = 2000;

  const $q = document.getElementById('q');
  const $results = document.getElementById('results');
  const $tabs = document.querySelectorAll('.tab');
  const $cntDocs = document.getElementById('cntDocs');
  const $cntPages = document.getElementById('cntPages');
  const $docCtrls = document.getElementById('docCtrls');
  const $pageCtrls = document.getElementById('pageCtrls');

  let mode = 'docs';
  let lastQuery = '';
  let renderedCount = 0;
  let cached = [];
  let expandedDoc = null;

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function highlight(text, query) {
    if (!query) return escHtml(text);
    const lc = text.toLowerCase();
    const lq = query.toLowerCase();
    let result = '';
    let i = 0;
    while (i < text.length) {
      const idx = lc.indexOf(lq, i);
      if (idx === -1) { result += escHtml(text.slice(i)); break; }
      result += escHtml(text.slice(i, idx));
      result += '<mark>' + escHtml(text.slice(idx, idx+lq.length)) + '</mark>';
      i = idx + lq.length;
    }
    return result;
  }

  function lanhuUrl(doc, pageId) {
    let u = 'https://lanhuapp.com/web/#/item/project/product?tid=' + TID +
      '&pid=' + PID + '&versionId=' + doc.v + '&docId=' + doc.d +
      '&docType=axure&image_id=' + doc.d;
    if (pageId) u += '&pageId=' + pageId;
    return u;
  }

  function getDocSort(){return document.querySelector('input[name=dsort]:checked').value}
  function getPageSort(){return document.querySelector('input[name=psort]:checked').value}

  // ============ Docs Mode ============
  function searchDocs(q) {
    if (!q) return docs.map((_, i) => ({d: i, score: 0}));
    const lq = q.toLowerCase();
    const out = [];
    for (let i = 0; i < docs.length; i++) {
      const idx = docs[i].n.toLowerCase().indexOf(lq);
      if (idx >= 0) out.push({d: i, score: 1000 - idx});
    }
    return out;
  }

  function sortDocs(arr) {
    const sm = getDocSort();
    if (sm === 'newest') arr.sort((a,b) => docs[b.d].o - docs[a.d].o);
    else if (sm === 'oldest') arr.sort((a,b) => docs[a.d].o - docs[b.d].o);
    else arr.sort((a,b) => b.score - a.score || docs[b.d].o - docs[a.d].o);
    return arr;
  }

  // ★ 关键修复：用 div 而非 a，避免嵌套；蓝湖按钮 stopPropagation
  function renderDocCard(item, query) {
    const d = docs[item.d];
    const url = lanhuUrl(d);
    const isExp = expandedDoc === item.d;
    const rankClass = d.rank === 1 ? 'r1' : d.rank === 2 ? 'r2' : d.rank === 3 ? 'r3' : '';
    return '<div class="card' + (isExp ? ' expanded' : '') + '" data-docidx="' + item.d + '">' +
      '<a class="lanhu" href="' + escHtml(url) + '" target="_blank" rel="noopener">蓝湖↗</a>' +
      '<div class="row1">' +
        '<span class="rank ' + rankClass + '">#' + d.rank + '</span>' +
        '<span class="title">' + highlight(d.n, query) + '</span>' +
      '</div>' +
      '<div class="row2">' +
        '<span class="badge">' + d.pc + ' 页</span>' +
        '<span>v' + d.vn + '</span>' +
        '<span>更新 ' + d.ut + '</span>' +
      '</div>' +
    '</div>';
  }

  function renderTreeRecursive(nodes, depth, doc, query) {
    let html = '';
    for (const n of nodes) {
      const indent = '\u00a0\u00a0\u00a0\u00a0'.repeat(depth);
      if (n.f) {
        html += '<div class="tree-node folder">' +
          '<span class="indent">' + indent + '</span>' +
          '<span class="icon">▾</span>' +
          '<span>' + highlight(n.n, query) + '</span>' +
        '</div>';
        if (n.c) html += renderTreeRecursive(n.c, depth + 1, doc, query);
      } else {
        const url = lanhuUrl(doc, n.i);
        html += '<div class="tree-node page">' +
          '<span class="indent">' + indent + '</span>' +
          '<span class="icon">·</span>' +
          '<a href="' + escHtml(url) + '" target="_blank" rel="noopener">' + highlight(n.n, query) + '</a>' +
          '<a class="open-link" href="' + escHtml(url) + '" target="_blank" rel="noopener">↗</a>' +
        '</div>';
      }
    }
    return html;
  }

  // ★ 关键修复：树面板放在同一个 grid 里，用 grid-column:1/-1 占满整行
  function renderDocsView() {
    const query = $q.value.trim();
    cached = sortDocs(searchDocs(query));
    $cntDocs.textContent = query ? cached.length + '/' + docs.length : docs.length;
    if (cached.length === 0) {
      $results.innerHTML = '<div class="empty">无匹配文档</div>';
      return;
    }
    const html = ['<div class="grid" id="docGrid">'];
    for (const item of cached) {
      html.push(renderDocCard(item, query));
      if (item.d === expandedDoc) {
        const d = docs[item.d];
        html.push('<div class="tree-panel">');
        html.push('<div class="tree-header">');
        html.push('<strong>' + escHtml(d.n) + '</strong>');
        html.push('<span class="meta-mini">#' + d.rank + ' · ' + d.pc + ' 页 · v' + d.vn + ' · 创建 ' + d.ct + ' · 更新 ' + d.ut + '</span>');
        html.push('<a class="open-doc" href="' + escHtml(lanhuUrl(d)) + '" target="_blank" rel="noopener">在蓝湖打开整份文档 ↗</a>');
        html.push('</div>');
        html.push('<div class="tree-list">');
        html.push(renderTreeRecursive(d.tree, 0, d, query));
        html.push('</div>');
        html.push('</div>');
      }
    }
    html.push('</div>');
    $results.innerHTML = html.join('');
    
    // 用事件委托绑定卡片点击（避免 inline onclick 干扰）
    const grid = document.getElementById('docGrid');
    grid.addEventListener('click', (e) => {
      // 如果点的是蓝湖按钮或 tree-panel 内的元素，忽略
      if (e.target.closest('.lanhu')) return;
      if (e.target.closest('.tree-panel')) return;
      const card = e.target.closest('.card');
      if (!card) return;
      const idx = +card.dataset.docidx;
      expandedDoc = expandedDoc === idx ? null : idx;
      renderDocsView();
      // 滚到展开的文档
      setTimeout(() => {
        const exp = document.querySelector('.card.expanded');
        if (exp) exp.scrollIntoView({block: 'nearest', behavior: 'smooth'});
      }, 30);
    });
  }

  // ============ Pages Mode ============
  function searchPages(q) {
    if (!q) return [];
    const lq = q.toLowerCase();
    const includeDocs = document.getElementById('searchDocsToo').checked;
    const out = [];
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      const pn = p.n.toLowerCase();
      const dn = includeDocs ? docs[p.d].n.toLowerCase() : '';
      const pIdx = pn.indexOf(lq);
      const dIdx = includeDocs ? dn.indexOf(lq) : -1;
      if (pIdx === -1 && dIdx === -1) continue;
      let score = 0;
      if (pIdx >= 0) score += 1000 - pIdx;
      if (dIdx >= 0) score += 500 - dIdx;
      out.push({p, pIdx, dIdx, score, pageIdx: i});
    }
    return out;
  }

  function sortPages(arr) {
    const sm = getPageSort();
    if (sm === 'rel') arr.sort((a,b) => b.score - a.score);
    else if (sm === 'newest') arr.sort((a,b) => docs[b.p.d].o - docs[a.p.d].o);
    else arr.sort((a,b) => docs[a.p.d].o - docs[b.p.d].o);
    return arr;
  }

  function dedupPages(arr) {
    const groups = new Map();
    for (const r of arr) {
      const key = r.p.n;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    }
    const out = [];
    for (const [, group] of groups) {
      group.sort((a,b) => docs[b.p.d].o - docs[a.p.d].o);
      const head = group[0];
      head.dups = group;
      out.push(head);
    }
    return out;
  }

  function renderPageRow(r, query, idx) {
    const doc = docs[r.p.d];
    const pageUrl = lanhuUrl(doc, r.p.i);
    const localUrl = encodeURIComponent(doc.f) + '/index.html';
    const isMulti = r.dups && r.dups.length > 1;
    const pathDisplay = r.p.p ? r.p.p : '(顶层)';
    return '<div class="result' + (isMulti ? ' deduped' : '') + '" data-idx="' + idx + '">' +
      '<span class="idx">#' + (idx+1) + '</span>' +
      '<div class="info">' +
        '<span class="name">' + highlight(r.p.n, query) + '</span>' +
        '<span class="docname">' + highlight(doc.n, query) + '</span>' +
        '<span class="path" title="' + escHtml(pathDisplay) + '">' + escHtml(pathDisplay) + '</span>' +
      '</div>' +
      (isMulti ? '<span class="multibadge">' + r.dups.length + ' 版本</span>' : '') +
      '<div class="actions">' +
        '<a class="btn" href="' + escHtml(localUrl) + '">本地索引</a>' +
        '<a class="btn primary" href="' + escHtml(pageUrl) + '" target="_blank" rel="noopener">蓝湖↗</a>' +
      '</div>' +
    '</div>' +
    (isMulti ? renderDupList(r, idx) : '');
  }

  function renderDupList(r, idx) {
    let h = '<div class="dup-list" id="dup' + idx + '">';
    for (const d of r.dups) {
      const doc = docs[d.p.d];
      const url = lanhuUrl(doc, d.p.i);
      h += '<div class="dup-row">' +
        '<span style="font-size:10px;color:#bbb">#' + doc.rank + '</span>' +
        '<span class="dn">' + escHtml(doc.n) + '</span>' +
        '<span style="font-size:10px;color:#999">' + doc.ut + '</span>' +
        '<a href="' + escHtml(url) + '" target="_blank" rel="noopener">蓝湖↗</a>' +
      '</div>';
    }
    h += '</div>';
    return h;
  }

  function renderPagesView() {
    const query = $q.value.trim();
    if (!query) {
      $cntPages.textContent = pages.length.toLocaleString();
      $results.innerHTML = '<div class="empty">输入关键字开始检索<br><span style="font-size:11px;color:#bbb;margin-top:4px;display:inline-block">例如：订单审核、批次管理、商家、扫描发货 …</span></div>';
      return;
    }
    let arr = searchPages(query);
    if (document.getElementById('dedup').checked) {
      arr = dedupPages(arr);
    }
    cached = sortPages(arr);
    const total = cached.length;
    $cntPages.textContent = query ? total.toLocaleString() + '/' + pages.length.toLocaleString() : pages.length.toLocaleString();
    if (total === 0) {
      $results.innerHTML = '<div class="empty">无匹配页面</div>';
      return;
    }
    $results.innerHTML = '<div class="results"></div>';
    renderedCount = 0;
    renderMore();
    
    // 事件委托：点击带"N 版本"的行展开
    const cont = $results.querySelector('.results');
    cont.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;  // 让按钮自然处理
      const row = e.target.closest('.result.deduped');
      if (!row) return;
      const idx = row.dataset.idx;
      const dl = document.getElementById('dup' + idx);
      if (dl) dl.classList.toggle('show');
    });
  }

  function renderMore() {
    const container = $results.querySelector('.results');
    if (!container) return;
    const start = renderedCount;
    const end = Math.min(renderedCount + PAGE_SIZE, Math.min(cached.length, MAX_RESULTS));
    const html = [];
    for (let i = start; i < end; i++) {
      html.push(renderPageRow(cached[i], lastQuery, i));
    }
    const oldMore = container.querySelector('.more-btn');
    if (oldMore) oldMore.remove();
    container.insertAdjacentHTML('beforeend', html.join(''));
    renderedCount = end;
    if (renderedCount < Math.min(cached.length, MAX_RESULTS)) {
      const remaining = Math.min(cached.length, MAX_RESULTS) - renderedCount;
      container.insertAdjacentHTML('beforeend',
        '<button class="more-btn" id="moreBtn">查看更多（还有 ' + remaining + ' 条）</button>'
      );
      document.getElementById('moreBtn').onclick = renderMore;
    } else if (cached.length > MAX_RESULTS) {
      container.insertAdjacentHTML('beforeend',
        '<div class="empty" style="padding:10px;font-size:10.5px">仅展示前 ' + MAX_RESULTS + ' 条匹配（共 ' + cached.length + '）</div>'
      );
    }
  }

  function render() {
    lastQuery = $q.value.trim();
    if (mode === 'docs') {
      $docCtrls.style.display = 'flex';
      $pageCtrls.style.display = 'none';
      renderDocsView();
    } else {
      $docCtrls.style.display = 'none';
      $pageCtrls.style.display = 'flex';
      renderPagesView();
    }
  }

  $tabs.forEach(t => t.addEventListener('click', () => {
    $tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    mode = t.dataset.mode;
    expandedDoc = null;
    render();
    history.replaceState(null, '', '#mode=' + mode + (lastQuery ? '&q=' + encodeURIComponent(lastQuery) : ''));
  }));

  let timer;
  $q.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if ($q.value.trim() && mode === 'docs') {
        const docMatch = searchDocs($q.value.trim()).length;
        if (docMatch === 0) {
          $tabs.forEach(x => x.classList.remove('active'));
          document.querySelector('.tab[data-mode="pages"]').classList.add('active');
          mode = 'pages';
        }
      }
      render();
      history.replaceState(null, '', '#mode=' + mode + (lastQuery ? '&q=' + encodeURIComponent(lastQuery) : ''));
    }, 80);
  });

  document.querySelectorAll('input[name=dsort],input[name=psort]').forEach(r => r.addEventListener('change', render));
  document.getElementById('dedup').addEventListener('change', render);
  document.getElementById('searchDocsToo').addEventListener('change', render);

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      if (e.key === 'Escape') { $q.value = ''; render(); }
      return;
    }
    if (e.key === '/' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); $q.focus(); }
  });

  const hash = location.hash.replace(/^#/, '');
  const params = new URLSearchParams(hash);
  if (params.get('mode') === 'pages') {
    $tabs.forEach(x => x.classList.remove('active'));
    document.querySelector('.tab[data-mode="pages"]').classList.add('active');
    mode = 'pages';
  }
  if (params.get('q')) {
    $q.value = params.get('q');
  }
  render();
})();
</script>
</body>
</html>
