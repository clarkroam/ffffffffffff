<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const TID = DATA.tid, PID = DATA.pid;
  const docs = DATA.docs, pages = DATA.pages;
  
  const PAGE_SIZE = 100;
  const MAX_RESULTS = 2000;
  
  const $q = document.getElementById('q');
  const $results = document.getElementById('results');
  const $empty = document.getElementById('empty');
  const $stat = document.getElementById('stat');
  const $searchDocs = document.getElementById('searchDocs');
  
  let currentResults = [];
  let renderedCount = 0;
  
  function escHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  
  function highlight(text, query) {
    if (!query) return escHtml(text);
    const lc = text.toLowerCase();
    const lq = query.toLowerCase();
    let result = '';
    let i = 0;
    while (i < text.length) {
      const idx = lc.indexOf(lq, i);
      if (idx === -1) { result += escHtml(text.slice(i)); break; }
      result += escHtml(text.slice(i, idx));
      result += '<mark>' + escHtml(text.slice(idx, idx+lq.length)) + '</mark>';
      i = idx + lq.length;
    }
    return result;
  }
  
  function lanhuPageUrl(doc) {
    return 'https://lanhuapp.com/web/#/item/project/product?tid=' + TID +
      '&pid=' + PID + '&versionId=' + doc.v + '&docId=' + doc.d +
      '&docType=axure&image_id=' + doc.d;
  }
  
  function search(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const includeDocs = $searchDocs.checked;
    const sortMode = document.querySelector('input[name=sort]:checked').value;
    const out = [];
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      const pn = p.n.toLowerCase();
      const dn = includeDocs ? docs[p.d].n.toLowerCase() : '';
      const pIdx = pn.indexOf(q);
      const dIdx = includeDocs ? dn.indexOf(q) : -1;
      if (pIdx === -1 && dIdx === -1) continue;
      let score = 0;
      if (pIdx >= 0) score += 1000 - pIdx;
      if (dIdx >= 0) score += 500 - dIdx;
      out.push({ p, pIdx, dIdx, score });
    }
    if (sortMode === 'rel') {
      out.sort((a, b) => b.score - a.score);
    } else if (sortMode === 'docOrder') {
      out.sort((a, b) => {
        const da = docs[a.p.d].o, db = docs[b.p.d].o;
        if (da !== db) return da - db;
        return a.p.i - b.p.i;
      });
    } else {  // docOrderDesc
      out.sort((a, b) => {
        const da = docs[a.p.d].o, db = docs[b.p.d].o;
        if (da !== db) return db - da;
        return a.p.i - b.p.i;
      });
    }
    return out.slice(0, MAX_RESULTS);
  }
  
  // 紧凑布局：所有内容在同一行
  function renderResult(r, query, idx) {
    const doc = docs[r.p.d];
    const pageUrl = lanhuPageUrl(doc);
    const localUrl = encodeURIComponent(doc.f) + '/index.html';
    return '<div class="result">' +
      '<span class="idx">#' + (idx+1) + '</span>' +
      '<div class="info">' +
        '<span class="name">' + highlight(r.p.n, query) + '</span>' +
        '<span class="docname">' + highlight(doc.n, query) + '</span>' +
        '<span class="pageidx">第 ' + r.p.i + ' 页</span>' +
      '</div>' +
      '<div class="actions">' +
        '<a class="btn" href="' + escHtml(localUrl) + '">本地索引</a>' +
        '<a class="btn primary" href="' + escHtml(pageUrl) + '" target="_blank" rel="noopener">蓝湖 ↗</a>' +
      '</div>' +
    '</div>';
  }
  
  function renderMore() {
    const query = $q.value.trim();
    const start = renderedCount;
    const end = Math.min(renderedCount + PAGE_SIZE, currentResults.length);
    const html = [];
    for (let i = start; i < end; i++) {
      html.push(renderResult(currentResults[i], query, i));
    }
    const oldMore = $results.querySelector('.more-btn');
    if (oldMore) oldMore.remove();
    
    $results.insertAdjacentHTML('beforeend', html.join(''));
    renderedCount = end;
    
    if (renderedCount < currentResults.length) {
      const remaining = currentResults.length - renderedCount;
      $results.insertAdjacentHTML('beforeend',
        '<button class="more-btn" id="moreBtn">查看更多（还有 ' + remaining + ' 条）</button>'
      );
      document.getElementById('moreBtn').onclick = renderMore;
    }
  }
  
  function doSearch() {
    const query = $q.value.trim();
    if (!query) {
      $results.innerHTML = '';
      $empty.style.display = 'block';
      $stat.textContent = '';
      currentResults = [];
      renderedCount = 0;
      return;
    }
    $empty.style.display = 'none';
    currentResults = search(query);
    renderedCount = 0;
    $results.innerHTML = '';
    if (currentResults.length === 0) {
      $results.innerHTML = '<div class="empty"><div style="font-size:18px">无匹配</div><div class="hint">尝试更短的关键字、或勾选/取消"同时搜索文档名"</div></div>';
      $stat.textContent = '0 条';
      return;
    }
    $stat.textContent = '匹配 ' + currentResults.length + ' 条' + (currentResults.length >= MAX_RESULTS ? '（已截断）' : '');
    renderMore();
    history.replaceState(null, '', '#q=' + encodeURIComponent(query));
  }
  
  let timer;
  $q.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(doSearch, 80);
  });
  $searchDocs.addEventListener('change', doSearch);
  document.querySelectorAll('input[name=sort]').forEach(r => r.addEventListener('change', doSearch));
  
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      if (e.key === 'Escape') { $q.value = ''; doSearch(); }
      return;
    }
    if (e.key === '/' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); $q.focus(); }
  });
  
  const m = location.hash.match(/q=([^&]+)/);
  if (m) {
    $q.value = decodeURIComponent(m[1]);
    doSearch();
  } else {
    $empty.style.display = 'block';
  }
})();
</script>
